[project]
name = "m365-mcp-gdpr"
version = "0.1.0"
description = "MCP-server för Microsoft 365 (Outlook och SharePoint) med GDPR-pseudonymisering av personuppgifter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "msal>=1.33,<2",
    # Windows inbyggda kontoruta (Web Account Manager) installeras automatiskt på Windows.
    "msal[broker]>=1.33,<2; sys_platform == 'win32'",
    "msal-extensions>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
# Inloggning via Company Portal på Mac (Apple Silicon).
broker = ["msal[broker]>=1.33,<2"]
dev = ["pytest>=8"]

[project.scripts]
m365-mcp-gdpr = "m365_mcp_gdpr.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
