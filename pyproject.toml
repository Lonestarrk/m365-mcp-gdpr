[project]
name = "outlook-mcp-gdpr"
version = "0.1.0"
description = "MCP-server för Outlook/Microsoft 365 med GDPR-pseudonymisering av personuppgifter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "msal>=1.30", "httpx>=0.27"]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
outlook-mcp-gdpr = "outlook_mcp_gdpr.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
